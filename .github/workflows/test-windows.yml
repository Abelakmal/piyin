name: Test run.bat on Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Show Python
        run: |
          python --version
          where python || where python3 || where py

      - name: Make run.bat executable (no-op on Windows)
        run: echo "Preparing to run run.bat"

      - name: Run run.bat tests
        run: |
          Write-Host "=== Test 1: Double dash ==="
          cmd /c .\run.bat --convert-folder examples
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host "=== Test 2: Single dash ==="
          cmd /c .\run.bat -convert-folder examples
          if ($LASTEXITCODE -ne 0) { exit 1 }
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
